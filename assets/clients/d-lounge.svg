<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="100" fill="#9d1818"/>
  <!-- 4 white dots on edges (poker chip) -->
  <circle cx="100" cy="14" r="11" fill="#fff"/>
  <circle cx="186" cy="100" r="11" fill="#fff"/>
  <circle cx="100" cy="186" r="11" fill="#fff"/>
  <circle cx="14" cy="100" r="11" fill="#fff"/>
  <!-- decorative border -->
  <circle cx="100" cy="100" r="68" fill="none" stroke="#f0d6b8" stroke-width="1"/>
  <circle cx="100" cy="100" r="62" fill="none" stroke="#f0d6b8" stroke-width="0.5"/>
  <!-- crown-like serifs at top/bottom -->
  <path d="M70 38 Q100 32 130 38" fill="none" stroke="#f0d6b8" stroke-width="0.8"/>
  <path d="M70 162 Q100 168 130 162" fill="none" stroke="#f0d6b8" stroke-width="0.8"/>
  <!-- cursive D -->
  <text x="100" y="130" font-family="'Brush Script MT', 'Cormorant Garamond', cursive" font-size="92" font-style="italic" fill="#f0d6b8" text-anchor="middle" font-weight="500">D</text>
</svg>
