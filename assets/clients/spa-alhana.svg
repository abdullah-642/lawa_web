<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#46182a"/>
  <!-- arc text 'Beauty Salon' -->
  <path id="spaArc" d="M 55 80 A 50 50 0 0 1 145 80" fill="none"/>
  <text font-family="'Inter', sans-serif" font-size="9" fill="#e6c5a8" letter-spacing="2">
    <textPath href="#spaArc" startOffset="50%" text-anchor="middle">Beauty Salon &#x25C6; صالون</textPath>
  </text>
  <!-- abstract woman -->
  <g transform="translate(100,95)" fill="#e6c5a8">
    <!-- hair flowing -->
    <path d="M-15 -8 Q-22 8 -18 22 L-10 22 Q-6 14 -8 6 Q-10 0 -15 -8 Z"/>
    <path d="M15 -8 Q22 8 18 22 L10 22 Q6 14 8 6 Q10 0 15 -8 Z"/>
    <!-- face -->
    <ellipse cx="0" cy="-2" rx="9" ry="11"/>
    <!-- hands covering -->
    <path d="M-6 6 Q-2 4 0 8 Q2 4 6 6 L6 14 L-6 14 Z" fill="#46182a"/>
  </g>
  <g transform="translate(100,140)" text-anchor="middle" fill="#e6c5a8">
    <text font-family="'Tajawal', serif" font-size="14" font-weight="500">سبا الهنا</text>
    <text y="14" font-family="'Inter', sans-serif" font-size="8" letter-spacing="3">SPA ALHANA</text>
  </g>
</svg>
