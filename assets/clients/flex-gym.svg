<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="flexBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ece1c4"/>
      <stop offset="1" stop-color="#d8c69e"/>
    </linearGradient>
    <pattern id="flexStripes" patternUnits="userSpaceOnUse" width="200" height="6">
      <rect width="200" height="3" fill="#1f1f1f"/>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#flexBg)"/>
  <!-- striped FLEX text -->
  <g transform="translate(58,118)">
    <text font-family="'Inter', sans-serif" font-size="44" font-weight="900" letter-spacing="2" fill="#1f1f1f">F L E X</text>
    <g fill="url(#flexStripes)" mask="url(#flexMask)"></g>
  </g>
  <!-- dumbbell -->
  <g transform="translate(135,90)">
    <rect x="0" y="6" width="18" height="3" fill="#2a2a2a"/>
    <rect x="-4" y="0" width="4" height="15" fill="#2a2a2a" rx="0.8"/>
    <rect x="18" y="0" width="4" height="15" fill="#2a2a2a" rx="0.8"/>
  </g>
</svg>
