<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" preserveAspectRatio="xMidYMid meet">
  <!-- Liwa wordmark — high-contrast serif, upright -->
  <text x="30" y="138"
        font-family="'Cormorant Garamond', 'Playfair Display', 'Times New Roman', Georgia, serif"
        font-size="148" font-weight="500"
        letter-spacing="-2" fill="currentColor">Liwa</text>

  <!-- Small triangle "period" -->
  <path d="M348 124 L368 134 L348 144 Z" fill="currentColor"/>

  <!-- Architectural mark: two trapezoidal columns forming a portal -->
  <g transform="translate(440, 28)" fill="currentColor">
    <path d="M0 0 L32 14 L32 142 L0 156 Z"/>
    <path d="M62 14 L94 0 L94 156 L62 142 Z"/>
  </g>

  <!-- CONCEPT DESIGN subtitle -->
  <text x="32" y="195"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="22" letter-spacing="14"
        font-weight="400" fill="currentColor">CONCEPT  DESIGN</text>
</svg>
