<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80">
  <!-- "Liwa" wordmark in italic serif -->
  <text x="2" y="50"
        font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif"
        font-size="52" font-weight="500" font-style="italic"
        fill="#0a0a0a" letter-spacing="-1.5">Liwa</text>
  <!-- Dot accent -->
  <circle cx="118" cy="48" r="3.2" fill="#0a0a0a"/>
  <!-- Architectural door / pillar icon (mirrors the original logo's right side) -->
